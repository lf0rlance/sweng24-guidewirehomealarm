services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/backend
    working_dir: /backend
    ports:
      - "8080:8080"
    command: ["sh", "-lc", "npm install && npm run dev"]

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/frontend
    working_dir: /frontend
    ports:
      - "5173:5173"
    command: ["sh", "-lc", "npm install && npm run dev -- --host 0.0.0.0"]

  microcontroller:
    build:
      context: ./microcontroller
      args:
        IDF_VER: release-v5.2
    volumes:
      - ./microcontroller:/microcontroller
      - espidf_tools:/root/.espressif
      - espidf_ccache:/root/.cache
    working_dir: /microcontroller
    command: ["bash", "-lc", "sleep infinity"]

volumes:
  espidf_tools:
  espidf_ccache:
