services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      # example
      - NODE_ENV=development
    volumes:
      - ./backend:/app
    working_dir: /app
    command: ["sh", "-lc", "npm install && npm run dev"]

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    working_dir: /app
    command: ["sh", "-lc", "npm install && npm run dev -- --host 0.0.0.0"]

  microcontroller:
    build:
      context: ./mcu
      args:
        IDF_VER: release-v5.2
    working_dir: /work
    volumes:
      - ./mcu:/work
      # optional caches to speed rebuilds:
      - espidf_tools:/root/.espressif
      - espidf_ccache:/root/.cache
    # keep container alive so you can exec into it and run idf.py commands
    command: ["bash", "-lc", "sleep infinity"]

volumes:
  espidf_tools:
  espidf_ccache:
