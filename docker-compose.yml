services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/backend
    working_dir: /backend
    ports:
      - "8080:8080"
    command: ["sh", "-lc", "npm install && npm run dev"]

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/frontend
    working_dir: /frontend
    ports:
      - "5173:5173"
    command: ["sh", "-lc", "npm install && npm run dev -- --host 0.0.0.0"]
microcontroller:
    build:
      context: ./microcontroller
      dockerfile: Dockerfile.micropython
    volumes:
      - ./microcontroller:/microcontroller
      - micropython_pip_cache:/root/.cache/pip
    working_dir: /microcontroller
    command: ["bash", "-lc", "sleep infinity"]

volumes:
  micropython_pip_cache:
