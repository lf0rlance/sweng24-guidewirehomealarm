stages:
  - validate
  - build
  - release

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: "1"
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  MICROCONTROLLER_IMAGE: $CI_REGISTRY_IMAGE/microcontroller

# Backend validation using Docker container
backend-syntax:
  stage: validate
  image: docker:24
  services:
    - docker:24-dind
  script:
    - cd backend
    - docker build -t backend-test -f Dockerfile --target builder .
    - docker run --rm backend-test python -m py_compile app/*.py *.py
  only:
    - merge_requests
    - main
    - develop

# Lint for code quality using Docker
backend-lint:
  stage: validate
  image: docker:24
  services:
    - docker:24-dind
  script:
    - cd backend
    - docker build -t backend-test -f Dockerfile --target builder .
    - docker run --rm backend-test sh -c "pip install flake8 && flake8 app/ --max-line-length=120 --exclude=__pycache__,*.pyc"
  allow_failure: true
  only:
    - merge_requests
    - main
    - develop

# Backend tests using Docker container
backend-test:
  stage: validate
  image: docker:24
  services:
    - docker:24-dind
  script:
    - cd backend
    - docker build -t backend-test -f Dockerfile --target builder .
    - docker run --rm backend-test sh -c "pip install pytest pytest-cov httpx && pytest tests/ -v"
  only:
    - merge_requests
    - main
    - develop

# Microcontroller validation using Docker container
microcontroller-syntax:
  stage: validate
  image: docker:24
  services:
    - docker:24-dind
  script:
    - cd microcontroller
    - docker build -t microcontroller-test .
    - docker run --rm microcontroller-test
  allow_failure: true
  only:
    - merge_requests
    - main

# Frontend build and test using Docker container
frontend-build:
  stage: validate
  image: docker:24
  services:
    - docker:24-dind
  script:
    - cd frontend
    - docker build -t frontend-test .
    - docker run --rm frontend-test
  allow_failure: true
  only:
    - merge_requests
    - main

# Build Docker image
build-backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker buildx create --use
  script:
    - cd backend
    - docker buildx build --platform linux/amd64,linux/arm64 -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA -t $BACKEND_IMAGE:latest --push .
  only:
    - main
  when: manual

# Build frontend Docker image
build-frontend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker buildx create --use
  script:
    - cd frontend
    - docker buildx build --platform linux/amd64,linux/arm64 -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA -t $FRONTEND_IMAGE:latest --push .
  only:
    - main
  when: manual

# Build microcontroller Docker image
build-microcontroller:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker buildx create --use
  script:
    - cd microcontroller
    - docker buildx build --platform linux/amd64,linux/arm64 -t $MICROCONTROLLER_IMAGE:$CI_COMMIT_SHORT_SHA -t $MICROCONTROLLER_IMAGE:latest --push .
  only:
    - main
  when: manual

# Automated version bump + tag
release-auto:
  stage: release
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  script: |
    set -e
    apk add --no-cache git curl
    git config user.email "ci-bot@tcd.com"
    git config user.name "ci-bot"
    git fetch origin main
    git checkout main

    VERSION=$(cat VERSION)
    IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

    COMMIT_MSG=$(git log -1 --pretty=%B "$CI_COMMIT_SHA")
    if echo "$COMMIT_MSG" | grep -q "BREAKING CHANGE"; then
      MAJOR=$((MAJOR + 1))
      MINOR=0
      PATCH=0
    elif echo "$COMMIT_MSG" | grep -q "!:"; then
      MAJOR=$((MAJOR + 1))
      MINOR=0
      PATCH=0
    elif echo "$COMMIT_MSG" | grep -q "^feat"; then
      MINOR=$((MINOR + 1))
      PATCH=0
    else
      PATCH=$((PATCH + 1))
    fi

    NEW_VERSION="$MAJOR.$MINOR.$PATCH"
    echo "$NEW_VERSION" > VERSION
    git add VERSION
    git commit -m "chore(release): bump version to $NEW_VERSION [skip ci]"
    git push "https://oauth2:$GITLAB_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git" HEAD:main

    NEW_SHA=$(git rev-parse HEAD)
    TAG="v${NEW_VERSION}"
    curl --request POST --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/tags?tag_name=${TAG}&ref=${NEW_SHA}"