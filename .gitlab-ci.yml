stages:
  - validate
  - build

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
  LATEST_TAG: $CI_REGISTRY_IMAGE/backend:latest

# Validate Python syntax - blocks bad code
backend-syntax:
  stage: validate
  image: python:3.11-slim
  script:
    - python -m py_compile backend/app/*.py backend/*.py
  only:
    - merge_requests
    - main
    - develop

# Lint for code quality
backend-lint:
  stage: validate
  image: python:3.11-slim
  before_script:
    - pip install flake8
  script:
    - cd backend && flake8 app/ --max-line-length=120 --exclude=__pycache__,*.pyc
  allow_failure: true
  only:
    - merge_requests
    - main
    - develop

# Basic tests
backend-test:
  stage: validate
  image: python:3.11-slim
  before_script:
    - cd backend
    - pip install -r requirements.txt pytest pytest-cov httpx
  script:
    - pytest tests/ -v
  only:
    - merge_requests
    - main
    - develop

# Validate microcontroller code
microcontroller-syntax:
  stage: validate
  image: python:3.11-slim
  script:
    - python -m py_compile microcontroller/src/*.py
  allow_failure: true
  only:
    - merge_requests
    - main

# Build Docker image
build-backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd backend
    - docker build -t $IMAGE_TAG -t $LATEST_TAG .
    - docker push $IMAGE_TAG
    - docker push $LATEST_TAG
  only:
    - main
  when: manual
